services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dpdpa
      POSTGRES_USER: dpdpa
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpdpa -d dpdpa"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://dpdpa:${DB_PASSWORD}@db:5432/dpdpa
    ports:
      - "127.0.0.1:8000:8000"     # put nginx/Apache with HTTPS in front
volumes:
  pgdata:
