{% extends "base.html" %}{% block body %}<h1>Change password</h1><p class="sub">Use at least 10 characters.</p>
<form method="post" class="card" style="max-width:420px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Current password</label><input type="password" name="current" required><label>New password</label><input type="password" name="new" required minlength="10">
<div style="margin-top:14px"><button>Change password</button></div></form>{% endblock %}
